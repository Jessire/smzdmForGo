<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>什么值得买 · 商品提醒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg-page:#f7f8fa;--surface:#ffffff;--surface-2:#fafafa;--surface-3:#f4f4f5;
  --border:#e9eaee;--border-2:#e4e4e7;--border-3:#f0f0f2;--border-4:#ececef;--border-hover:#d4d4d8;
  --ink:#18181b;--ink-2:#3f3f46;--ink-3:#52525b;--muted:#71717a;--muted-2:#a1a1aa;--muted-3:#c8c8ce;
  --accent:#2563eb;--accent-hover:#1d4ed8;--accent-active:#1e40af;--accent-bg:#eff6ff;--accent-border:#dbeafe;--sel-bg:#f8faff;
  --ok:#15803d;--ok-bg:#f0fdf4;--ok-border:#dcfce7;--ok-dot:#22c55e;
  --warn:#b45309;--warn-bg:#fef3c7;
  --coupon:#c2410c;--coupon-bg:#fff7ed;--coupon-border:#fed7aa;
  --danger:#dc2626;--danger-hover:#b91c1c;--danger-bg:#fef2f2;
  --thumb-bg:linear-gradient(160deg,#f8f8f9,#eef0f3);
  --k-product-bg:#ffedd5;--k-product-fg:#c2410c;--k-hot-bg:#fff1f2;--k-hot-fg:#e11d48;--k-author-bg:#eff6ff;--k-author-fg:#2563eb;
}
[data-theme="dark"]{
  --bg-page:#101013;--surface:#18181c;--surface-2:#1d1d22;--surface-3:#26262d;
  --border:#26262d;--border-2:#303038;--border-3:#232329;--border-4:#2a2a31;--border-hover:#3d3d46;
  --ink:#f4f4f5;--ink-2:#d4d4d8;--ink-3:#b6b6bf;--muted:#9a9aa3;--muted-2:#71717c;--muted-3:#52525c;
  --accent:#3b82f6;--accent-hover:#60a5fa;--accent-active:#2563eb;--accent-bg:#1c2a4a;--accent-border:#2d4370;--sel-bg:#192338;
  --ok:#4ade80;--ok-bg:#12281a;--ok-border:#1d4029;--ok-dot:#22c55e;
  --warn:#fbbf24;--warn-bg:#2c2310;
  --coupon:#fb923c;--coupon-bg:#2e2010;--coupon-border:#4a3418;
  --danger:#f87171;--danger-hover:#ef4444;--danger-bg:#301b1b;
  --thumb-bg:linear-gradient(160deg,#1e1e24,#26262d);
  --k-product-bg:#33240f;--k-product-fg:#fdba74;--k-hot-bg:#341521;--k-hot-fg:#fb7185;--k-author-bg:#1c2a4a;--k-author-fg:#60a5fa;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{font-family:"Geist","Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg-page);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
input,select,button,textarea{font:inherit;color:inherit}
input::placeholder{color:var(--muted-2)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:8px}
::selection{background:var(--accent-border)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}
::-webkit-scrollbar-track{background:transparent}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
.app{height:100vh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;flex:none;border-bottom:1px solid var(--border);background:var(--surface)}
.logo{width:30px;height:30px;flex:none;display:grid;place-items:center;background:#e11d48;color:#fff;font-weight:700;font-size:15px;border-radius:8px}
.cols{flex:1;min-height:0;display:flex;align-items:stretch}
.side{width:clamp(264px,20vw,312px);flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface)}
.tgcol{width:clamp(268px,18vw,304px);flex:none;display:flex;flex-direction:column;min-height:0;overflow-y:auto;border-left:1px solid var(--border);background:var(--surface)}
.tgrail{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;border-left:1px solid var(--border);background:var(--surface)}
.main{flex:1;min-width:0;overflow-y:auto}
.wrap{max-width:1120px;padding:20px 28px 40px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;cursor:pointer;font-weight:500;border:1px solid var(--border-2);background:var(--surface);color:var(--ink-2);transition:background .15s,opacity .15s,transform .1s}
.btn:hover{background:var(--surface-3)}
.btn-pri{background:var(--accent);color:#fff;border:none;font-weight:600}
.btn-pri:hover{background:var(--accent-hover)}
.btn-pri:active{background:var(--accent-active);transform:scale(.98)}
.btn-danger{background:var(--danger);color:#fff;border:none;font-weight:600}
.btn-danger:hover{background:var(--danger-hover)}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;cursor:pointer;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-3)}
.ghost-btn{display:grid;place-items:center;background:transparent;border:none;border-radius:6px;cursor:pointer;color:var(--muted-2)}
.ghost-btn:hover{background:var(--surface-3);color:var(--ink)}
.input{height:36px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);font-size:14px;width:100%}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.lbl{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.lbl .dim{font-weight:400;color:var(--muted-2)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:flex;background:var(--surface-3);border-radius:8px;padding:3px;gap:2px}
.seg button{border:none;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);background:transparent;height:26px;padding:0 14px}
.seg button.on{color:var(--ink);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--accent-hover);background:var(--accent-bg);border:1px solid var(--accent-border);padding:2px 6px 2px 9px;border-radius:999px}
.chip .x{cursor:pointer;width:14px;height:14px;display:grid;place-items:center;border-radius:50%;font-size:11px;line-height:1}
.chip .x:hover{background:var(--accent-border)}
.qchip{cursor:pointer;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--border-2);color:var(--muted);background:var(--surface)}
.qchip.on{border-color:var(--accent-border);color:var(--accent-hover);background:var(--accent-bg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.stepper{display:flex;align-items:stretch;height:36px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);overflow:hidden}
.stepper button{flex:none;width:32px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:16px}
.stepper button:hover{background:var(--surface-3);color:var(--ink)}
.stepper input{width:100%;min-width:36px;border:none;text-align:center;font-size:15px;font-weight:600;background:transparent}
.stepper input:focus{background:var(--accent-bg);border-radius:0}
.stepper .unit{flex:none;display:flex;align-items:center;padding:0 10px;font-size:13px;color:var(--muted);border-left:1px solid var(--border-4)}
.stepper select{flex:none;border:none;border-left:1px solid var(--border-4);background:var(--surface);font-size:13px;color:var(--ink-2);padding:0 3px;cursor:pointer}
.stepper select:focus{background:var(--accent-bg)}
.switch{width:36px;height:20px;flex:none;cursor:pointer;position:relative;display:inline-block;border-radius:999px;transition:background .15s;background:var(--border-hover)}
.switch.on{background:var(--accent)}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch.on i{left:18px}
.rule-card{display:flex;flex-direction:column;gap:8px;padding:12px;cursor:pointer;border-radius:8px;border:1px solid var(--border-4);background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s}
.rule-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.rule-card.sel{border-color:var(--accent);background:var(--sel-bg);box-shadow:0 0 0 1px var(--accent)}
.rule-card.off{opacity:.6}
.product-card{display:flex;flex-direction:column;border:1px solid var(--border-4);border-radius:8px;overflow:hidden;background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s}
.product-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.product-card.dim{opacity:.62}
.meta-ico{display:inline-flex;align-items:center;gap:3px}
.dlg-mask{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(24,24,27,.4);backdrop-filter:blur(2px);z-index:50}
.dlg{width:min(440px,100%);background:var(--surface);border-radius:12px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;right:20px;top:64px;background:#18181b;color:#fafafa;padding:10px 18px;font-size:13px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:60}
[data-theme="dark"] .toast{background:#f4f4f5;color:#18181b}
.hidden{display:none!important}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;border-radius:12px}
.stat{border-right:1px solid var(--border-3);display:flex;align-items:stretch;min-height:70px}
.stat:last-child{border-right:none}
.stat .ico{width:70px;flex:none;display:grid;place-items:center;background:var(--surface-3);border-right:1px solid var(--border-3);color:var(--ink-3)}
.stat .tx{padding:10px 16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;padding:18px 20px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px;padding:14px 20px 20px}
.logrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-3);font-size:13px}
@media (max-width:1180px){.tgcol{display:none}.tgrail{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <div class="logo">值</div>
    <div style="display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0">
      <span style="font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap">什么值得买 · 商品提醒</span>
      <span style="width:1px;height:16px;background:var(--border);flex:none"></span>
      <span id="hdrMeta" style="font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">加载中…</span>
    </div>
    <span id="demoBadge" class="pill hidden" style="color:var(--warn);background:var(--warn-bg)">演示模式 · 未连接后端</span>
    <span class="pill" id="scanPill" style="color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-border)"><i style="width:6px;height:6px;border-radius:50%;background:var(--ok-dot)"></i>扫描运行中</span>
    <button class="icon-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题"></button>
    <button class="icon-btn" id="logsBtn" title="推送记录" aria-label="推送记录">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </header>
  <div class="cols">
    <aside class="side">
      <div style="flex:none;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:600;color:var(--ink-2);margin-right:auto">商品规则</span>
          <button class="ghost-btn" style="width:28px;height:28px" id="reloadBtn" title="刷新">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
          </button>
          <button id="addBtn" style="height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>新建
          </button>
        </div>
        <div class="seg" id="tabSeg">
          <button data-tab="all" class="on" style="flex:1">全部</button>
          <button data-tab="on" style="flex:1">仅启用</button>
          <button data-tab="off" style="flex:1">仅停用</button>
        </div>
        <div style="position:relative">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted-2)" stroke-width="2" stroke-linecap="round" style="position:absolute;left:10px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="ruleSearch" placeholder="搜索规则名称 / 关键词" style="height:32px;padding-left:30px;font-size:13px">
        </div>
      </div>
      <div style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 10px 10px;display:flex;flex-direction:column;gap:6px" id="ruleList"></div>
      <div style="flex:none;padding:10px 16px;font-size:11.5px;color:var(--muted-2);border-top:1px solid var(--border-3)" id="listFooter"></div>
    </aside>

    <main class="main">
      <div class="wrap">
        <section class="card statgrid" id="statsBar"></section>
        <section class="card" id="ruleEditor"></section>
        <section class="card" id="searchRule">
          <div style="display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border-3)">
            <h3 style="margin:0;font-size:14.5px;font-weight:600">搜索预览</h3>
            <span style="font-size:12px;color:var(--muted-2)" id="previewSub">等待搜索</span>
            <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
              <div style="position:relative">
                <select id="sortSel" style="appearance:none;-webkit-appearance:none;height:30px;padding:0 26px 0 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);font-size:12.5px;color:var(--ink-2);cursor:pointer">
                  <option>按值率</option><option>按价格</option><option>按评论数</option><option>按时间</option>
                </select>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted-2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none"><path d="m6 9 6 6 6-6"/></svg>
              </div>
              <a id="openExt" class="icon-btn hidden" style="width:30px;height:30px" title="在什么值得买打开" target="_blank" rel="noopener">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
              </a>
            </div>
          </div>
          <div id="previewBody"></div>
        </section>
      </div>
    </main>

    <aside class="tgcol" id="tgPanel"></aside>
    <aside class="tgrail hidden" id="tgRail">
      <button class="icon-btn" style="width:28px;height:28px" id="tgExpand" title="展开 Telegram 面板">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span style="writing-mode:vertical-rl;font-size:11px;letter-spacing:.14em;color:var(--muted-2)">TELEGRAM 通知</span>
    </aside>
  </div>
</div>
<div id="dlgHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
/* ---------- state ---------- */
var state = {
  config: null, demo: false, dirty: false,
  sel: { kind: 'product', idx: 0 },   // kind: product | hot | author
  tab: 'all', q: '', tgOpen: true, advOpen: false,
  pendingSel: null, preview: 'idle', results: [], previewMeta: null,
  logs: [], lastPushable: null,
  gatePresets: loadJSON('smzdm_gate_presets', { loose:{c:0,r:0}, mid:{c:10,r:10}, strict:{c:50,r:20} })
};
var COMMON_FILTERS = ['临期','过期','售罄','二手'];
var selectedRuleKind = 'product';

function loadJSON(k, dft){ try{ var v=JSON.parse(localStorage.getItem(k)); return v||dft; }catch(e){ return dft; } }
function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function el(id){ return document.getElementById(id); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:n; }

/* ---------- api ---------- */
function api(path, opts){
  return fetch(path, opts).then(function(r){ return r.json(); }).then(function(j){
    if (j.code !== '0' && j.code !== 0) throw new Error(j.msg || '请求失败');
    return j;
  });
}
function demoConfig(){
  return {
    keyWords:['显示器','面包'], filterWords:['二手','支架'],
    lowCommentNum:5, lowWorthyNum:20, minPrice:300, maxPrice:2000,
    satisfyNum:5, tickTime:7200, maxArticleAgeDays:7, cron:'0 10 10 ? * *',
    telegram:{enabled:true, botToken:'demo-token', chatId:'-100123', parseMode:'HTML', disableWebPagePreview:false},
    keywordRules:[
      {enabled:true, words:['显示器'], filterWords:['二手','支架'], lowCommentNum:5, lowWorthyNum:20, minPrice:300, maxPrice:2000},
      {enabled:true, words:['面包'], filterWords:['临期'], lowCommentNum:1, lowWorthyNum:6, minPrice:0, maxPrice:0}
    ],
    globalHot:{enabled:true, windowHours:3, minCommentNum:200, hotKeywords:[], followAuthorsEnabled:false, followedAuthors:[], authorKeywords:[], filterWords:[], lowCommentNum:0, lowWorthyNum:0, minPrice:0, maxPrice:0}
  };
}
function demoItems(kw){
  function mk(t,p,w,c,d,st){ return {title:t,price:p,worthy:w,comment:c,pic:'',url:'#',referral:'',date:d,pushState:st}; }
  return { keyword:kw, openUrl:'', pushable:2, alreadyPushed:1, tooOld:1, items:[
    mk('今日必买：'+kw+' 高性价比款 演示数据','¥329','40','76','07-25 09:52','ok'),
    mk(kw+' 旗舰款 演示数据','¥458','15','89','07-25 18:13','ok'),
    mk('百亿补贴：'+kw+' 入门款 演示数据','¥229','20','569','07-25 13:09','already_pushed'),
    mk(kw+' 老款 演示数据','¥199','12','33','07-18 10:11','too_old')
  ]};
}

/* ---------- config helpers ---------- */
function rules(){ return state.config.keywordRules || []; }
function gh(){ return state.config.globalHot; }
function ruleName(r){ return (r.words && r.words.length) ? r.words.join('、') : '新规则'; }
function tickLabel(){ var t=state.config.tickTime||10800; return t%3600===0 ? '每 '+(t/3600)+' 小时' : '每 '+Math.round(t/60)+' 分钟'; }
function currentRule(){
  if (state.sel.kind==='product') return rules()[state.sel.idx] || null;
  return null;
}
function selEnabled(){
  if (state.sel.kind==='product'){ var r=currentRule(); return r ? r.enabled!==false : false; }
  if (state.sel.kind==='hot') return !!gh().enabled;
  return !!gh().followAuthorsEnabled;
}
function setSelEnabled(v){
  if (state.sel.kind==='product'){ var r=currentRule(); if(r) r.enabled=v; }
  else if (state.sel.kind==='hot') gh().enabled=v;
  else gh().followAuthorsEnabled=v;
}
function selName(){
  if (state.sel.kind==='hot') return '搜索热门';
  if (state.sel.kind==='author') return '搜索作者';

    });

    var inp=document.createElement('input');

    inp.placeholder=opts.placeholder||'回车添加，支持逗号分隔';

      if(e.key==='Enter'&&inp.value.trim()){
        inp.value.split(/[,，\n]/).forEach(function(p){ p=p.trim(); if(p&&arr.indexOf(p)<0) arr.push(p); });

      }
    });

      var q=document.createElement('div');
      q.style.cssText='display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px';

/* ---------- search preview ---------- */
function searchRulePayload(){
  if (state.sel.kind==='product'){
    var r=currentRule();
    return { words:r.words||[], filterWords:r.filterWords||[], lowCommentNum:r.lowCommentNum||0, lowWorthyNum:r.lowWorthyNum||0, minPrice:r.minPrice||0, maxPrice:r.maxPrice||0 };
  }
  var g=gh();
  return { words:[], filterWords:g.filterWords||[], lowCommentNum:g.lowCommentNum||0, lowWorthyNum:g.lowWorthyNum||0, minPrice:g.minPrice||0, maxPrice:g.maxPrice||0 };
}
function runSearch(){
  if (state.sel.kind==='product'){
    var r=currentRule();
    if (!r || !(r.words||[]).length){ toast('请先填写关键词'); return; }
  }
  state.preview='loading'; renderPreview(); syncBadge();
  var p;
  if (state.demo){
    p=new Promise(function(res){ setTimeout(function(){ res({data:demoItems(selName())}); }, 600); });
  } else if (state.sel.kind==='product'){
    p=api('/productSearch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({rule:searchRulePayload(), limit:20})});
  } else {
    p=api('/discoverySearch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type:state.sel.kind, globalHot:gh(), rule:searchRulePayload(), limit:20})});
  }
  p.then(function(j){
    state.preview='done';
    state.previewMeta=j.data;
    state.results=j.data.items||[];
    state.lastPushable=j.data.pushable||0;
    renderPreview(); renderStats(); syncBadge();
  }).catch(function(e){
    state.preview='idle'; renderPreview(); syncBadge();
    toast('搜索失败：'+e.message);
  });
}
function sortedResults(){
  var mode=el('sortSel')?el('sortSel').value:'按值率';
  var arr=state.results.slice();
  arr.sort(function(a,b){
    if(mode==='按价格') return num(a.price)-num(b.price);
    if(mode==='按评论数') return num(b.comment)-num(a.comment);
    if(mode==='按时间') return String(b.date).localeCompare(String(a.date));
    return num(b.worthy)-num(a.worthy);
  });
  return arr;
}
function pushStateInfo(st){
  if(st==='ok') return {label:'可推送', color:'var(--ok)', bg:'var(--ok-bg)', note:'满足门槛且未推送过'};
  if(st==='already_pushed') return {label:'已推送', color:'var(--accent)', bg:'var(--accent-bg)', note:'此前已推送，自动去重'};
  if(st==='too_old') return {label:'超出时间', color:'var(--muted)', bg:'var(--surface-3)', note:'发布时间超出扫描范围'};
  return {label:'日期异常', color:'var(--muted)', bg:'var(--surface-3)', note:'无法解析发布时间'};
}

    var payload={telegram: state.tgEdit?{enabled:true,botToken:el('tgToken').value.trim(),chatId:el('tgChat').value.trim(),parseMode:el('tgMode').value,disableWebPagePreview:el('tgNoPreview').checked}:t};
    if (state.demo){ toast('演示模式：测试消息未发送'); return; }
    toast('正在发送测试消息…');
    api('/telegramTest', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
      .then(function(j){ toast(j.msg||'测试发送成功'); loadLogs(); })
      .catch(function(e){ toast('测试发送失败：'+e.message); });
  });
}

/* ---------- push logs ---------- */
function loadLogs(){
  if (state.demo){
    state.logs=[{title:'扫描完成 · 无新推送',status:'skip',reason:'没有新命中（演示数据）',time:'12:00:00',image:''}];
    renderStats(); renderTg(); return Promise.resolve();
  }
  return api('/pushLogs').then(function(j){
    state.logs=j.data||[];
    renderStats(); renderTg();
  }).catch(function(){ /* silent */ });
}
function openLogs(){
  var rows=state.logs.length?state.logs.map(function(l){
    var color=l.status==='success'?'var(--ok)':(l.status==='fail'?'var(--danger)':'var(--muted)');
    var bg=l.status==='success'?'var(--ok-bg)':(l.status==='fail'?'var(--danger-bg)':'var(--surface-3)');
    var label=l.status==='success'?'成功':(l.status==='fail'?'失败':'跳过');
    return '<div class="logrow">'+
      '<span class="pill" style="flex:none;color:'+color+';background:'+bg+'">'+label+'</span>'+
      '<div style="min-width:0;flex:1"><div style="font-weight:500;line-height:1.4">'+esc(l.title)+'</div>'+
      '<div style="font-size:12px;color:var(--muted-2)">'+esc(l.reason||'')+'</div></div>'+
      '<span style="flex:none;font-size:12px;color:var(--muted-2)">'+esc(l.time||'')+'</span></div>';
  }).join(''):'<div style="padding:24px;text-align:center;color:var(--muted-2);font-size:13px">暂无推送记录</div>';
  showDialog(
    '<div style="display:flex;align-items:center;gap:8px"><div style="font-size:15.5px;font-weight:600;margin-right:auto">推送记录 <span style="font-weight:400;color:var(--muted-2);font-size:12.5px">近 '+state.logs.length+' 条</span></div>'+
    '<button class="ghost-btn dlg-close" style="width:28px;height:28px">✕</button></div>'+
    '<div style="max-height:min(480px,60vh);overflow-y:auto">'+rows+'</div>'
  );
}

/* ---------- dialogs & toast ---------- */
function showDialog(inner, onMask){
  var host=el('dlgHost');
  host.innerHTML='<div class="dlg-mask"><div class="dlg">'+inner+'</div></div>';
  var mask=host.firstChild;
  mask.addEventListener('click', function(e){ if(e.target===mask){ closeDialog(); if(onMask)onMask(); } });
  host.querySelectorAll('.dlg-close').forEach(function(b){ b.addEventListener('click', closeDialog); });
}
function closeDialog(){ el('dlgHost').innerHTML=''; }
function renderDeleteDialog(){
  var name=selName();
  showDialog(
    '<div style="width:38px;height:38px;display:grid;place-items:center;background:var(--danger-bg);border-radius:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></div>'+
    '<div style="font-size:15.5px;font-weight:600">删除规则「'+esc(name)+'」？</div>'+
    '<div style="font-size:13px;color:var(--muted);line-height:1.6">删除后将停止该规则的后台扫描与推送，历史推送记录保留。此操作不可撤销。</div>'+
    '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">'+
      '<button class="btn dlg-close" style="height:36px;padding:0 16px;font-size:13px">取消</button>'+
      '<button class="btn btn-danger" id="dlgDelOk" style="height:36px;padding:0 16px;font-size:13px">确认删除</button></div>'
  );
  el('dlgDelOk').addEventListener('click', function(){
    rules().splice(state.sel.idx,1);
    state.sel={kind:'product', idx:0};
    if(!rules().length) state.sel={kind:'hot', idx:0};
    closeDialog();
    state.dirty=false;
    saveConfig('规则「'+name+'」已删除').then(function(){ renderEditor(); renderPreview(); });
  });
}
function renderSwitchDialog(){
  var target=state.pendingSel;
  var names={hot:'搜索热门', author:'搜索作者'};
  var tname=target.kind==='product'?ruleName(rules()[target.idx]||{}):names[target.kind];
  showDialog(
    '<div style="width:38px;height:38px;display:grid;place-items:center;background:var(--warn-bg);border-radius:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>'+
    '<div style="font-size:15.5px;font-weight:600">当前规则有未保存的改动</div>'+
    '<div style="font-size:13px;color:var(--muted);line-height:1.6">切换到「'+esc(tname)+'」将丢弃这些改动。可以先返回保存，或直接放弃。</div>'+
    '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">'+
      '<button class="btn" id="dlgDiscard" style="height:36px;padding:0 16px;font-size:13px;color:var(--danger)">放弃改动并切换</button>'+
      '<button class="btn btn-pri dlg-close" style="height:36px;padding:0 16px;font-size:13px">返回继续编辑</button></div>',
    function(){ state.pendingSel=null; }
  );
  el('dlgDiscard').addEventListener('click', function(){
    closeDialog();
    loadConfig().then(function(){ doSelect(target.kind, target.idx); });
  });
}
var toastTimer=null;
function toast(msg){
  el('toastHost').innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el('toastHost').innerHTML=''; }, 2600);
}

/* ---------- theme ---------- */
function applyTheme(){
  var t=localStorage.getItem('smzdm_theme')||'light';
  el('app').setAttribute('data-theme', t);
  el('themeBtn').innerHTML=t==='light'
    ?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'
    :'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
}

/* ---------- boot ---------- */
function renderAll(){ renderList(); renderStats(); renderEditor(); renderPreview(); renderTg(); }
function loadConfig(){
  return api('/productConfig').then(function(j){
    state.config=j.data; state.demo=false;
  }).catch(function(){
    state.config=demoConfig(); state.demo=true;
    el('demoBadge').classList.remove('hidden');
  }).then(function(){
    state.dirty=false;
    if (state.sel.kind==='product' && !rules()[state.sel.idx]) state.sel={kind:rules().length?'product':'hot', idx:0};
  });
}
el('themeBtn').addEventListener('click', function(){
  var t=(localStorage.getItem('smzdm_theme')||'light')==='light'?'dark':'light';
  localStorage.setItem('smzdm_theme', t); applyTheme();
});
el('logsBtn').addEventListener('click', openLogs);
el('reloadBtn').addEventListener('click', function(){
  if (state.dirty){ toast('有未保存改动，请先保存或放弃'); return; }
  loadConfig().then(function(){ renderAll(); toast('规则列表已刷新'); });
});
el('addBtn').addEventListener('click', function(){
  if (state.dirty){ toast('有未保存改动，请先保存'); return; }
  addRule();
});
el('tabSeg').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  state.tab=b.getAttribute('data-tab');
  document.querySelectorAll('#tabSeg button').forEach(function(x){ x.classList.toggle('on', x===b); });
  renderList();
});
el('ruleSearch').addEventListener('input', function(e){ state.q=e.target.value.trim(); renderList(); });
el('sortSel').addEventListener('change', function(){ if(state.preview==='done') renderPreview(); });
el('tgExpand').addEventListener('click', function(){ state.tgOpen=true; renderTg(); });

applyTheme();
loadConfig().then(function(){ renderAll(); loadLogs(); });
})();
</script>
</body>
</html>
